<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Wayfare</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--muted:#6b6862;--line:#e4e1da;
  --accent:#0f766e;--accent-ink:#fff;--accent-soft:#d9efec;--warn:#b45309;--danger:#b91c1c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--card:#1f1e1c;--ink:#f0eee9;--muted:#a19d95;--line:#33312d;
  --accent:#2dd4bf;--accent-ink:#04201d;--accent-soft:#16332f;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:22px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:0 16px 24px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:10px 0 12px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a .ic{display:block;font-size:22px;line-height:1.1}
nav.tabs a.on{color:var(--accent)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:8px 10px}
.btn.block{width:100%}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:72px;resize:vertical}
label.f{display:block;margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;font-size:30px}
.rcard{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit}
.rcard h3{margin:0 0 2px;font-size:17px}
.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);background:var(--line);display:block}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery .g{position:relative}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;cursor:pointer}
.gallery .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:20px 0 6px}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--accent)}
.done{text-decoration:line-through;color:var(--muted)}
.stars{color:#f59e0b;letter-spacing:1px}
.starpick button{background:none;border:0;font-size:28px;color:var(--line);cursor:pointer;padding:0 2px}
.starpick button.on{color:#f59e0b}
.day h3{margin:0;font-size:17px}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .t{width:52px;flex:none;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:48px}
.listedit .li{display:flex;gap:6px;margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin-top:4px}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .cap{position:absolute;bottom:20px;left:16px;right:16px;color:#fff;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px}
.searchbar{position:relative}
.searchbar input{padding-left:38px}
.searchbar span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
a.link{color:var(--accent);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<header class="top"><button id="back" class="btn icon" hidden aria-label="Back">←</button><h1 id="title">Wayfare</h1><span id="actions"></span></header>
<main id="app"></main>
<nav class="tabs">
  <a href="#/trips" data-tab="trips"><span class="ic">🗺️</span>Trips</a>
  <a href="#/food" data-tab="food"><span class="ic">🍜</span>Restaurants</a>
  <a href="#/settings" data-tab="settings"><span class="ic">⚙️</span>Backup</a>
</nav>
<script src="app.js"></script>
</body>
</html>
